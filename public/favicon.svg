<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <!-- Background: deep dark with a rich purple-navy top -->
    <linearGradient id="uc-bg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1a1040"/>
      <stop offset="100%" stop-color="#080b14"/>
    </linearGradient>

    <!-- Horseshoe U arc: violet top → brand purple → cyan bottom -->
    <linearGradient id="uc-arc" x1="256" y1="175" x2="256" y2="408" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#c4b5fd"/>
      <stop offset="48%"  stop-color="#6c63ff"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>

    <!-- Launch chevron: indigo base → ice-white apex -->
    <linearGradient id="uc-arrow" x1="256" y1="270" x2="256" y2="108" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#e0f2fe"/>
    </linearGradient>

    <!-- Radial glow sitting behind the icon mark -->
    <radialGradient id="uc-glow" cx="256" cy="290" r="210" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#6c63ff" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#6c63ff" stop-opacity="0"/>
    </radialGradient>

    <!-- Soft halo for the U arc -->
    <filter id="uc-halo" x="-28%" y="-28%" width="156%" height="156%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Bright glow for the launch arrow + apex dot -->
    <filter id="uc-bright" x="-70%" y="-70%" width="240%" height="240%">
      <feGaussianBlur stdDeviation="18" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- ░░ Background ░░ -->
  <rect width="512" height="512" rx="110" fill="url(#uc-bg)"/>
  <!-- Radial inner glow -->
  <rect width="512" height="512" rx="110" fill="url(#uc-glow)"/>
  <!-- Subtle purple border ring -->
  <rect width="512" height="512" rx="110" fill="none" stroke="#6c63ff" stroke-width="2.5" opacity="0.28"/>

  <!-- ░░ Horseshoe "U" — the Unleash power arc ░░
       Left arm : (158, 178) straight down to (158, 295)
       Bottom arc: smooth curve through (256, 408)
       Right arm: (354, 295) straight up to (354, 178)
       stroke-linecap=round gives clean rounded ends at the top opening -->
  <path
    d="M 158 178 L 158 295 Q 158 408 256 408 Q 354 408 354 295 L 354 178"
    fill="none"
    stroke="url(#uc-arc)"
    stroke-width="66"
    stroke-linecap="round"
    filter="url(#uc-halo)"
  />

  <!-- ░░ Launch chevron — bursting upward through the U opening ░░
       Base points sit just inside the inner walls of the U arms.
       Apex pierces slightly above the arm tops (y=178) → escape velocity feel. -->
  <path
    d="M 210 264 L 256 148 L 302 264"
    fill="none"
    stroke="url(#uc-arrow)"
    stroke-width="46"
    stroke-linecap="round"
    stroke-linejoin="round"
    filter="url(#uc-bright)"
  />

  <!-- ░░ Apex star — the north-star moment of launch ░░ -->
  <circle cx="256" cy="142" r="26" fill="#f8fafc" filter="url(#uc-bright)"/>
  <!-- Inner bright core -->
  <circle cx="256" cy="142" r="13" fill="white"/>
</svg>